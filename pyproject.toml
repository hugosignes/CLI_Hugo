[project]
name = "cli-tareas"
version = "1.0.0"
description = "CLI multiplataforma para automatizar tareas sobre ficheros con sistema e IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tareas = "tareas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tareas"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
